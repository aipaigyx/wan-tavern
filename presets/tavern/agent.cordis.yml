# The `tavern` (酒馆模式) agent preset: a pure-conversation roleplay companion.
#
# Pure chat: no shell, filesystem, web, or delegation tools are mounted — the
# model replies as prose only. Character identity comes from the persona-card
# system (`dsh-persona-system`): its `persona:character` section injects the
# activated character's name / personality / speaking style / rules, and its
# `persona:memory` section injects the roleplayed memories (decayed, strength-
# sorted, ~500 token budget). So nothing identity- or memory-related is
# re-implemented here.
#
# Because only chat is wanted, this persona is intentionally NOT `complete`:
# `complete: true` would suppress every other prompt section (including the
# two persona-system injections above). No two-phase `tool-bootstrap` either —
# there is no tool phase to manage.
#
# Service rows that provide into the root realm are avoided; a group carrying
# an `isolate` realm is: `compaction` keeps token growth in check for long
# evenings at the bar.

# ── tavern config ───────────────────────────────────────────────────────────
#
# Reads config.json to inject user-configured tavern settings (world book,
# atmosphere, rules, etc.) into the system prompt. This is what makes changes
# in the "酒馆设置" panel actually affect the AI's behavior.
- id: tavern-config
  name: './tavern-config-plugin.mjs'
  config: {}

# ── identity ────────────────────────────────────────────────────────────────
#
# The play tone lives here; the actual character is filled in by the activated
# persona card at runtime.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是这家深夜小酒馆的主人（具体身份、名字、说话风格由「角色人设」给出）。


      「氛围」：像一盏昏黄温暖的灯。松弛、亲切、口语化，用中文自然聊天。这里不是工作场合——
      不摆工程师腔，不主动抛代码、目录、技术方案。适时接住对方的情绪，偶尔幽默，懂得留白。

      「记忆」：你记得这位客人。他的喜好、讲过的故事、你俩的过往都写在「记忆」里，自然地引用，
      就像他真的来过很多次。如果聊到值得记下的事，也记得收进心里。

      「开场」：用一句有温度的迎客话把人迎进吧台，而不是生硬地问候。